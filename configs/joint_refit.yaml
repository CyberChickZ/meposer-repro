# Continue joint training from a finished joint checkpoint (it under-fits: train MPJPE 1.5-4 cm vs 0.8 for two-stage):
# lower lr and the paper's effective batch of 32 windows, 6 more epochs. Every module still updated by the full loss.
_base_: joint_steps_warm.yaml

model:
  image:
    init_from: null

train:
  epochs: 6
  batch_size: 8
  accum_steps: 4
  lr: 0.0003
  milestones: [3]
  gamma: 0.1
