[project]
name = "meposer"
version = "0.1.0"
description = "Reproduction of MEPoser (EMHI, AAAI 2025): multimodal egocentric human pose estimation"
requires-python = ">=3.11"
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "pillow>=10",
    "opencv-python-headless>=4.9",
    "pyyaml>=6",
    "tqdm>=4.66",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
meposer = "meposer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meposer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
